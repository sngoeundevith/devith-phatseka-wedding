<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>លិខិតអញ្ជើញមង្គលការ (ដេវីត ♥ ផាត់សិកា)</title>
    <link href="https://fonts.googleapis.com/css2?family=Moul&family=Kantumruy+Pro:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* ស្ទីលសម្រាប់កម្រងរូបភាពទម្រង់បែប Facebook */
        .fb-gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2px;
            margin-top: 10px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--primary-gold);
            background: var(--primary-gold);
        }

        .fb-gallery-item {
            position: relative;
            height: 110px;
            cursor: pointer;
            overflow: hidden;
        }

        .fb-gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .fb-gallery-item:hover img {
            transform: scale(1.05);
        }

        .fb-gallery-item.hidden-img {
            display: none;
        }

        .fb-more-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            font-family: 'Moul', cursive;
        }

        /* Lightbox សម្រាប់ពេលចុចមើលរូបធំ */
        .lightbox-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 999999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            user-select: none;
        }

        .lightbox-modal.active {
            display: flex;
        }

        .lightbox-content {
            max-width: 95%;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 8px;
            border: 2px solid var(--primary-gold);
            cursor: grab;
            transition: transform 0.3s ease, opacity 0.3s ease;
            opacity: 1;
            transform: scale(1);
            touch-action: manipulation;
        }

        .lightbox-content.animating {
            opacity: 0;
            transform: scale(0.92);
        }

        .lightbox-content:active {
            cursor: grabbing;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 25px;
            color: #ffffff;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1000000;
            line-height: 1;
            user-select: none;
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(212, 175, 55, 0.4);
            color: white;
            border: none;
            font-size: 24px;
            padding: 12px 16px;
            cursor: pointer;
            border-radius: 50%;
            z-index: 1000000;
            transition: background 0.3s ease;
            user-select: none;
        }

        .lightbox-nav:hover {
            background: rgba(212, 175, 55, 0.9);
        }

        .lightbox-prev { left: 15px; }
        .lightbox-next { right: 15px; }

        :root {
            --primary-gold: #d4af37;
            --dark-gold: #aa7c11;
            --bg-cream: #fffdfa;
            --text-color: #2c2c2c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kantumruy Pro', sans-serif;
        }

        body {
            background-color: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .mobile-card {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            max-height: 932px;
            background-color: var(--bg-cream);
            position: relative;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .petal {
            position: absolute;
            top: -20px;
            background: linear-gradient(135deg, #ffc0cb1e 0%, #ffb7c51d 50%, #ff8da21a 100%);
            width: 12px;
            height: 18px;
            border-radius: 50% 50% 50% 50% / 80% 80% 20% 20%;
            opacity: 0.60;
            pointer-events: none;
            animation: fall linear infinite;
            z-index: 99;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0.60;
            }
            50% {
                transform: translateY(50vh) translateX(30px) rotate(180deg);
            }
            100% {
                transform: translateY(105vh) translateX(-30px) rotate(360deg);
                opacity: 0.2;
            }
        }

        .door-wrapper {
            display: flex;
            width: 100%;
            max-width: 430px;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            overflow: hidden;
            z-index: 10000;
            background: #0d0d0d;
            pointer-events: auto;
            perspective: 1200px;
            transition: visibility 8.5s ease, opacity 8.5s ease;
        }

        .door {
            width: 50%;
            height: 100%;
            border: 4px solid #d4af37;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.9);
            position: relative;
            transition: transform 8.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 8.5s ease;
            background-size: cover !important;
            background-repeat: no-repeat !important;
            background-color: #1a0c05;
            cursor: pointer;
        }

        .door-left {
            background-image: url('door-left.jpg');
            background-position: left center;
            transform-origin: left center;
        }

        .door-right {
            background-image: url('door-right.jpg');
            background-position: right center;
            transform-origin: right center;
        }

        .door-wrapper.opened .door-left { transform: rotateY(120deg); opacity: 0.3; }
        .door-wrapper.opened .door-right { transform: rotateY(-120deg); opacity: 0.3; }
        .door-wrapper.opened { pointer-events: none; visibility: hidden; opacity: 0; }

        .content {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 10;
        }

        .page-content {
            display: none !important;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            box-sizing: border-box;
        }

        .page-content.active {
            display: flex !important;
            flex-direction: column;
        }

        #page1 {
            width: 100%;
            height: 100%;
